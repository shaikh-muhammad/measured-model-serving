name: Model-free data tests
on:
  pull_request:
permissions:
  contents: read
jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'
      - run: python -m pip install --only-binary=:all: --no-deps -r requirements-ci.lock
      - run: python -m pip check
      - name: Prepare approved pytest temporary directory
        run: sudo install -d -o "$(id -u)" -g "$(id -g)" /home/sm/Projects/.pytest-tmp-measured-model-serving
      - name: Offline data tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTEST_ADDOPTS: '-p no:cacheprovider'
          HF_HUB_OFFLINE: '1'
          HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
        run: python -m pytest tests/test_data.py -v --basetemp=/home/sm/Projects/.pytest-tmp-measured-model-serving
